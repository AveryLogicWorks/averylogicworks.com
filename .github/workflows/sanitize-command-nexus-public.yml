name: Sanitize Command Nexus public copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanitize-command-nexus-public.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace proprietary implementation details with public-safe copy
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path('command-nexus.html'): [
                  (
                      "A desktop mission control powered by the NEXUS Cognitive Architecture &mdash; hierarchical memory, Trifecta Folding cognition, quantum entanglement reasoning, and a metacognitive engine that thinks about how it thinks.",
                      "A desktop mission control powered by the NEXUS Cognitive Architecture &mdash; designed for persistent context, adaptable reasoning, self-checking, and flexible local or external model support."
                  ),
                  (
                      "Command Nexus runs the NEXUS Cognitive Architecture: a four-dimensional intelligence system with hierarchical memory, Trifecta Folding reasoning, quantum entanglement cognition, and an optional plug-in external intelligence engine. It remembers across domains, reflects on its own output, and improves from experience &mdash; all locally on your machine.",
                      "Command Nexus combines local-first AI, persistent context, adaptable reasoning, automation, and flexible model support in one operating environment. It is designed to maintain continuity, review its own output, and improve the usefulness of results over time &mdash; while keeping proprietary implementation details private."
                  ),
                  (
                      "<h3>NEXUS Cognitive Architecture</h3>\n          <p>A proprietary intelligence system with three native cognitive dimensions that always run simultaneously: Lexical-Semantic, Relational-Graph, and Experiential-Meta. An optional fourth dimension supports external intelligence plug-ins (API or local models). All dimensions fuse into one unified result &mdash; ~4x performance over single-brain approaches.</p>",
                      "<h3>NEXUS Cognitive Architecture</h3>\n          <p>A proprietary cognitive layer designed to combine persistent context, reasoning, memory, and tool use into a unified result. The internal architecture and implementation methods remain confidential.</p>"
                  ),
                  (
                      "<h3>Trifecta Folding Cognition</h3>\n          <p>Three native cognitive dimensions folded into one simultaneous operating state using quantum mechanics as a modeling language: superposition, entanglement, interference, and decoherence. A fourth slot accepts external intelligence &mdash; third-party API or local models (untrusted but usable, restricted by anti-confliction guard layer with confidence caps, guardrail screening, and circuit breaker). Ambiguity across dimensions becomes the signal, not the noise.</p>",
                      "<h3>Multi-Path Reasoning</h3>\n          <p>Evaluates complex tasks from multiple reasoning perspectives and combines useful signals into a coherent result. The proprietary fusion methods, internal pathways, and implementation details are intentionally not disclosed.</p>"
                  ),
                  (
                      "<h3>Frontier Cognition Engine</h3>\n          <p>Five proprietary capabilities found nowhere else: Counterfactual Simulation, Causal Chain Detection, Analogy Engine (cross-domain mapping without embeddings), Recursive Self-Reflection, and Ambiguity Triangulation.</p>",
                      "<h3>Advanced Reasoning</h3>\n          <p>Designed for complex, multi-step problems that benefit from alternative viewpoints, relationship awareness, self-checking, and refinement. Proprietary reasoning methods remain private.</p>"
                  ),
                  (
                      "<h3>Hierarchical Memory Store</h3>\n          <p>Multi-level memory with NREM/REM consolidation, experiential learning, persona memory, and emotional continuity. Your AI remembers across domains &mdash; culinary, technical, personal &mdash; and consolidates memories during idle cycles like human sleep.</p>",
                      "<h3>Persistent Memory</h3>\n          <p>Maintains useful context across sessions and domains so agents can build on prior work, preferences, and decisions without requiring constant re-explanation.</p>"
                  ),
                  (
                      "The Forge supports 128-capability orchestration with compatibility matrix validation.",
                      "The Forge supports multi-capability orchestration with compatibility checks so complex workflows can be assembled without exposing the underlying implementation."
                  ),
                  (
                      "<h3>Metacognitive Engine</h3>\n          <p>The AI thinks about how it thinks. Effort leveling, risk tiering, and self-evaluation ensure responses are coherent and complete before they reach you. It revises its own output when it detects gaps.</p>",
                      "<h3>Self-Checking Intelligence</h3>\n          <p>Reviews its own output for gaps, inconsistencies, and task fit before presenting a result, helping improve coherence on complex work without exposing internal reasoning mechanics.</p>"
                  ),
                  (
                      "<h3>Non-Optional Governance</h3>\n          <p>Built-in governance sanitizer, baseline guardrails, capability guardrails, and tripwire manager. Secrets, illegal content, injection attacks, and sexual content are blocked at the engine level &mdash; not as an afterthought.</p>",
                      "<h3>Built-In Safety &amp; Governance</h3>\n          <p>Safety and governance are integrated into the operating environment rather than added as an afterthought, with protections designed to reduce unsafe, unauthorized, or adversarial behavior.</p>"
                  ),
                  (
                      "<h3>Fused Search Registry</h3>\n          <p>An 8-finder registry combining BM25, semantic, phonetic, knowledge layer, relation graph, containment, metacognitive, and experiential search. Results are fused across all finders for maximum recall and precision.</p>",
                      "<h3>Integrated Search &amp; Retrieval</h3>\n          <p>Brings together multiple search and knowledge-retrieval approaches to improve recall, relevance, and continuity across tasks. Internal retrieval architecture remains proprietary.</p>"
                  ),
                  (
                      "<h3>External Intelligence Slot (Dim 4)</h3>\n          <p>An open fourth dimension in the Trifecta Fold. Users can plug in a third-party API or local model for a slight capability boost (e.g., online search via API). External models are treated as untrusted: confidence is capped, all output is screened through guardrails, and a circuit breaker disables them after repeated failures. They can never override Command Nexus's own intelligence.</p>",
                      "<h3>External Model Support</h3>\n          <p>Connect supported third-party APIs or local models when a task benefits from additional resources. External model output remains subject to Command Nexus safety and control policies.</p>"
                  ),
                  (
                      "Command Nexus runs a full cognitive architecture with 142+ verified tests across 7 intelligence domains. Hierarchical memory, fused search, governance, metacognition, experiential learning, and 128-capability orchestration &mdash; all working, all local, all under your control.",
                      "Command Nexus brings together persistent context, adaptable reasoning, multi-capability orchestration, integrated safety, local-first operation, and extensive internal testing &mdash; while keeping proprietary architecture and implementation details private."
                  ),
              ],
              Path('index.html'): [
                  (
                      "Powered by the NEXUS Cognitive Architecture &mdash; Trifecta Folding cognition, hierarchical memory, quantum entanglement reasoning, and a metacognitive engine that thinks about how it thinks. <span class=\"no-code\">No coding required.</span>",
                      "Powered by the NEXUS Cognitive Architecture &mdash; designed for persistent context, adaptable reasoning, self-checking, and flexible model support while proprietary implementation details remain private. <span class=\"no-code\">No coding required.</span>"
                  ),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match, found {count}: {old[:90]!r}')
                  text = text.replace(old, new, 1)
              if text == original:
                  raise SystemExit(f'{path}: no changes made')
              path.write_text(text, encoding='utf-8')

          banned = [
              'Trifecta Fold', 'Trifecta Folding', 'quantum entanglement',
              'Counterfactual Simulation', 'Causal Chain Detection',
              'Ambiguity Triangulation', 'Lexical-Semantic', 'Relational-Graph',
              'Experiential-Meta', '128-capability', 'Fused Search Registry',
              'External Intelligence Slot (Dim 4)', 'NREM/REM',
              'anti-confliction guard layer', 'confidence caps', 'circuit breaker'
          ]
          for path in (Path('command-nexus.html'), Path('index.html')):
              text = path.read_text(encoding='utf-8')
              leftovers = [term for term in banned if term.lower() in text.lower()]
              if leftovers:
                  raise SystemExit(f'{path}: proprietary terms still present: {leftovers}')

          # Basic structural safety checks: keep the page shell and critical interactive IDs/scripts intact.
          cn = Path('command-nexus.html').read_text(encoding='utf-8')
          required = [
              '<!doctype html>', '<main id="main"', 'id="free-trial"', 'id="pricing"',
              'id="ft-claim-btn"', 'id="cn-download-btn"',
              'assets/site-config.js', 'assets/site-shell.js', 'assets/site.js',
              '@supabase/supabase-js@2', '</body>', '</html>'
          ]
          missing = [token for token in required if token not in cn]
          if missing:
              raise SystemExit(f'command-nexus.html structural check failed: {missing}')
          PY

      - name: Commit sanitized public copy
        shell: bash
        run: |
          git config user.name "Avery Logic Works site maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm --quiet .github/workflows/sanitize-command-nexus-public.yml
          git add command-nexus.html index.html
          git diff --cached --check
          git commit -m "Sanitize Command Nexus public architecture copy"
          git push origin HEAD:main
