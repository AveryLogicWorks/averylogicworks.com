name: Sanitize Command Nexus public copy

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sanitize-command-nexus.yml'

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove proprietary implementation details from public page
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('command-nexus.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'A desktop mission control powered by the NEXUS Cognitive Architecture &mdash; hierarchical memory, Trifecta Folding cognition, quantum entanglement reasoning, and a metacognitive engine that thinks about how it thinks.':
              'A desktop mission control powered by proprietary local intelligence designed for persistent context, adaptive reasoning, flexible AI tools, and controlled multi-step work on your own machine.',

            'Command Nexus runs the NEXUS Cognitive Architecture: a four-dimensional intelligence system with hierarchical memory, Trifecta Folding reasoning, quantum entanglement cognition, and an optional plug-in external intelligence engine. It remembers across domains, reflects on its own output, and improves from experience &mdash; all locally on your machine.':
              'Command Nexus is a local-first AI workspace built to help people use, create, and coordinate AI agents without exposing the proprietary architecture behind them. It supports persistent context, adaptive reasoning, multi-step workflows, and optional external models while keeping the core system under your control.',

            'A proprietary intelligence system with three native cognitive dimensions that always run simultaneously: Lexical-Semantic, Relational-Graph, and Experiential-Meta. An optional fourth dimension supports external intelligence plug-ins (API or local models). All dimensions fuse into one unified result &mdash; ~4x performance over single-brain approaches.':
              'A proprietary intelligence layer designed to maintain context, coordinate reasoning, and support reliable multi-step work. Internal architecture, implementation methods, and unpublished performance mechanisms remain confidential.',

            '<h3>Trifecta Folding Cognition</h3>':
              '<h3>Multi-Path Reasoning</h3>',

            'Three native cognitive dimensions folded into one simultaneous operating state using quantum mechanics as a modeling language: superposition, entanglement, interference, and decoherence. A fourth slot accepts external intelligence &mdash; third-party API or local models (untrusted but usable, restricted by anti-confliction guard layer with confidence caps, guardrail screening, and circuit breaker). Ambiguity across dimensions becomes the signal, not the noise.':
              'Designed to examine complex requests from multiple perspectives before producing a unified response. The internal reasoning methods and fusion mechanisms are proprietary and intentionally not exposed.',

            '<h3>Frontier Cognition Engine</h3>':
              '<h3>Advanced Reasoning</h3>',

            'Five proprietary capabilities found nowhere else: Counterfactual Simulation, Causal Chain Detection, Analogy Engine (cross-domain mapping without embeddings), Recursive Self-Reflection, and Ambiguity Triangulation.':
              'Designed for complex analysis, ambiguity handling, self-checking, and adaptive problem solving while keeping the underlying proprietary methods private.',

            '<h3>Hierarchical Memory Store</h3>':
              '<h3>Persistent Context &amp; Memory</h3>',

            'Multi-level memory with NREM/REM consolidation, experiential learning, persona memory, and emotional continuity. Your AI remembers across domains &mdash; culinary, technical, personal &mdash; and consolidates memories during idle cycles like human sleep.':
              'Maintains useful context across tasks and sessions so agents can build on prior work instead of starting from zero. Internal storage, organization, and consolidation methods remain proprietary.',

            'Pick your use case, set capabilities with simple sliders, and dial in personality-trait levels &mdash; building an agent is as easy as making choices, not writing code. The Forge supports 128-capability orchestration with compatibility matrix validation.':
              'Pick your use case, set capabilities with simple controls, and dial in personality-trait levels &mdash; building an agent is as easy as making choices, not writing code. The Forge supports broad multi-capability workflows with built-in compatibility checks.',

            'The AI thinks about how it thinks. Effort leveling, risk tiering, and self-evaluation ensure responses are coherent and complete before they reach you. It revises its own output when it detects gaps.':
              'Built-in self-checking helps the system review responses, recognize uncertainty, and improve coherence before results reach you.',

            'Built-in governance sanitizer, baseline guardrails, capability guardrails, and tripwire manager. Secrets, illegal content, injection attacks, and sexual content are blocked at the engine level &mdash; not as an afterthought.':
              'Safety and governance protections are built into the platform to help keep agent activity controlled, privacy-conscious, and appropriate for the task.',

            '<h3>Fused Search Registry</h3>':
              '<h3>Unified Search</h3>',

            'An 8-finder registry combining BM25, semantic, phonetic, knowledge layer, relation graph, containment, metacognitive, and experiential search. Results are fused across all finders for maximum recall and precision.':
              'Combines multiple forms of retrieval and contextual lookup to surface relevant information while keeping the proprietary search architecture private.',

            '<h3>External Intelligence Slot (Dim 4)</h3>':
              '<h3>Optional External Intelligence</h3>',

            "An open fourth dimension in the Trifecta Fold. Users can plug in a third-party API or local model for a slight capability boost (e.g., online search via API). External models are treated as untrusted: confidence is capped, all output is screened through guardrails, and a circuit breaker disables them after repeated failures. They can never override Command Nexus's own intelligence.":
              'Connect supported third-party APIs or local models when you want additional capabilities. External systems remain bounded by Command Nexus safety and control policies and do not replace the core local intelligence.',

            'Command Nexus runs a full cognitive architecture with 142+ verified tests across 7 intelligence domains. Hierarchical memory, fused search, governance, metacognition, experiential learning, and 128-capability orchestration &mdash; all working, all local, all under your control.':
              'Command Nexus brings together persistent context, adaptive reasoning, agent creation, governance, local operation, and multi-capability workflows. Explore the product, real-world use cases, and what is being built next.'
          }

          missing = []
          for old, new in replacements.items():
              if old not in text:
                  missing.append(old[:90])
              else:
                  text = text.replace(old, new)

          if missing:
              raise SystemExit('Refusing partial edit; expected text not found: ' + ' | '.join(missing))

          forbidden = [
              'Trifecta Fold', 'Trifecta Folding', 'quantum entanglement',
              'Lexical-Semantic', 'Relational-Graph', 'Experiential-Meta',
              '128-capability', '8-finder', 'Counterfactual Simulation',
              'Causal Chain Detection', 'Ambiguity Triangulation',
              'NREM/REM consolidation', 'anti-confliction guard layer'
          ]
          leaked = [term for term in forbidden if term.lower() in text.lower()]
          if leaked:
              raise SystemExit('Refusing commit; proprietary terms still present: ' + ', '.join(leaked))

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit sanitized public copy
        shell: bash
        run: |
          if git diff --quiet -- command-nexus.html; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'Avery Logic Works site hotfix'
          git config user.email 'averylogicworks@gmail.com'
          git add command-nexus.html
          git commit -m 'Sanitize Command Nexus public copy and correct capability wording'
          git push origin HEAD:main
